version: "3.9"

services:
  api:
    build: .
    container_name: railway-crowd-api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  dashboard:
    build: .
    container_name: railway-crowd-dashboard
    command: streamlit run src/dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env.example
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    depends_on:
      - api
